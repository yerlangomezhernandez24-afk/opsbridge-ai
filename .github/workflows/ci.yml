name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend · Python 3.12
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install locked dependencies
        run: python -m pip install --constraint requirements.lock --editable ".[dev]"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Ruff lint
        run: python -m ruff check src tests
      - name: Ruff format
        run: python -m ruff format --check src tests
      - name: Strict mypy
        run: python -m mypy --strict src
      - name: Test
        run: python -m pytest -q
      - name: Verify migrations from an empty database
        env:
          OPSBRIDGE_DATABASE_URL: sqlite+pysqlite:///./var/ci.db
        run: |
          mkdir -p var
          python -m alembic upgrade head
          python -m alembic check

  frontend:
    name: Frontend · Node 24
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm typecheck
      - name: ESLint
        run: pnpm lint
      - name: Component tests
        run: pnpm test -- --run
      - name: Production build
        run: pnpm build
