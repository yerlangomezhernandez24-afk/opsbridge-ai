[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "opsbridge-ai"
version = "1.0.0rc1"
description = "Local-first intelligent IT operations platform backend."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
  { name = "Yerlan Daniel Gómez Hernández" },
]
dependencies = [
  "alembic==1.20.1",
  "argon2-cffi==25.1.0",
  "fastapi==0.162.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.2",
  "sqlalchemy==2.1.6",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.16.0",
  "mypy==2.4.0",
  "pytest==9.2.0",
  "ruff==0.17.3",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

